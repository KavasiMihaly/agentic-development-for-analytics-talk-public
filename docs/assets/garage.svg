<style>
.lab-spark { transform: translate(var(--dx), var(--dy)); }
.lab-spark--1 { --dx: -60px; --dy: -70px; --ex: -95px; --ey: 40px; --t: .95s; --d: -.10s; }
.lab-spark--2 { --dx: -30px; --dy: -92px; --ex: -50px; --ey: 60px; --t: 1.10s; --d: -.55s; }
.lab-spark--3 { --dx: 22px; --dy: -82px; --ex: 36px; --ey: 70px; --t: 1.00s; --d: -.30s; }
.lab-spark--4 { --dx: 56px; --dy: -60px; --ex: 92px; --ey: 50px; --t: .90s; --d: -.70s; }
.lab-spark--5 { --dx: -86px; --dy: -40px; --ex: -140px; --ey: 60px; --t: 1.05s; --d: -.20s; }
.lab-spark--6 { --dx: 82px; --dy: -36px; --ex: 132px; --ey: 56px; --t: .95s; --d: -.85s; }
.lab-spark--7 { --dx: -14px; --dy: -112px; --ex: -26px; --ey: 30px; --t: 1.20s; --d: -.40s; }
.lab-spark--8 { --dx: 40px; --dy: -102px; --ex: 66px; --ey: 46px; --t: 1.15s; --d: -.95s; }
.lab-spark--9 { --dx: -112px; --dy: -20px; --ex: -172px; --ey: 70px; --t: .85s; --d: -.60s; }
.lab-spark--10 { --dx: 106px; --dy: -14px; --ex: 162px; --ey: 80px; --t: .90s; --d: -.15s; }
.lab-spark--11 { --dx: -50px; --dy: -30px; --ex: -82px; --ey: 48px; --t: .75s; --d: -.35s; }
.lab-spark--12 { --dx: 64px; --dy: -26px; --ex: 100px; --ey: 48px; --t: .80s; --d: -.50s; }
.lab-spark--13 { --dx: -6px; --dy: -62px; --ex: -10px; --ey: 48px; --t: .70s; --d: -.25s; }
.lab-spark--14 { --dx: 26px; --dy: -46px; --ex: 42px; --ey: 48px; --t: .78s; --d: -.65s; }
.lab-smoke { opacity: .25; transform: translate(var(--sx), -50px) scale(1.3); }
.lab-smoke--1 { --sx: -10px; --d: 0s; }
.lab-smoke--2 { --sx: 14px; --d: -2s; }
@media (prefers-reduced-motion: no-preference) {
  .lab-burst { animation: lab-burst 4.2s linear infinite; }
  .lab-flicker { animation: lab-flicker .9s steps(1, end) infinite; }
  .lab-spark { animation: lab-spark var(--t) cubic-bezier(.2, .6, .4, 1) var(--d) infinite; }
  .lab-smoke { animation: lab-smoke 4s ease-out var(--d) infinite; }
  .lab-cursor { animation: lab-blink 1.1s steps(1, end) infinite; }
  .lab-led { animation: lab-blink 2.2s steps(1, end) infinite; }
}
@keyframes lab-burst { 0%, 64% { opacity: 1; } 68%, 94% { opacity: 0; } 97%, 100% { opacity: 1; } }
@keyframes lab-flicker { 0% { opacity: 1; } 12% { opacity: .55; } 22% { opacity: 1; } 37% { opacity: .7; } 48% { opacity: 1; } 63% { opacity: .5; } 71% { opacity: .95; } 86% { opacity: .65; } }
@keyframes lab-spark { 0% { transform: translate(0, 0); opacity: 0; } 8% { opacity: 1; } 45% { transform: translate(var(--dx), var(--dy)); opacity: 1; } 100% { transform: translate(var(--ex), var(--ey)); opacity: 0; } }
@keyframes lab-smoke { 0% { transform: translate(0, 0) scale(.5); opacity: 0; } 25% { opacity: .35; } 100% { transform: translate(var(--sx), -150px) scale(2); opacity: 0; } }
@keyframes lab-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
</style>
